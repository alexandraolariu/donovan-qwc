[functions]
  node_bundler = "esbuild"
  # @sparticuz/chromium ships its Chromium build as a separate compressed
  # file that isn't picked up by default bundling — this makes sure it's
  # included in the deployed function package.
  included_files = ["node_modules/@sparticuz/chromium/**"]

[functions."render-pdf"]
  # Netlify's free/Pro synchronous function timeout ceiling. Cold-starting
  # Chromium plus rendering can be tight against the default 10s — this
  # requests the higher ceiling. (Actually raising the limit may require a
  # paid Netlify plan; if this function still times out on your plan, that's
  # the next thing to check in the Netlify dashboard under Functions settings.)
  timeout = 26
