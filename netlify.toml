# Forces Netlify to actually run `npm install` before deploying — this site apparently
# never needed that before (send-form6.mjs has no dependencies), so @sparticuz/chromium
# was likely never being installed at all, which is why included_files had nothing to
# copy. This [build] block makes the install step explicit and mandatory.
[build]
  command = "npm install"

[functions]
  node_bundler = "esbuild"

[functions."render-pdf"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]
