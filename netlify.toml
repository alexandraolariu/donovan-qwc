[functions]
  # NOT esbuild — esbuild squashes @sparticuz/chromium's own module folder
  # into the bundle, which breaks the __dirname-based path it uses
  # internally to find its own Chromium binary files (this is what caused
  # "input directory .../bin does not exist"). Netlify's default bundler
  # keeps node_modules intact instead, so the package can find itself.
  included_files = ["node_modules/@sparticuz/chromium/**"]

[functions."render-pdf"]
  # Netlify's synchronous function timeout ceiling. Cold-starting Chromium
  # plus rendering can be tight against the default 10s. NOTE: per current
  # Netlify community reports, setting this alone does NOT raise the limit —
  # it also requires (a) being on a paid Pro-or-higher plan, and (b) asking
  # Netlify support to activate the 26s ceiling for this specific site. If
  # the function still cuts off around 10s after the bin-path fix, that's
  # the next step — a support request, not another code change.
  timeout = 26
